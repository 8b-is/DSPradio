[package]
name = "dsp-radio-protocol"
version = "0.1.0"
edition = "2024"
authors = ["Christopher Chenoweth <git@8b.is>", "Aye <aye@8b.is>"]
license = "MIT"
description = "Shared protocol types for DSPradio broker system"
repository = "https://github.com/8bit-wraith/DSPradio"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
mdns-sd = "0.11"
thiserror = "2.0"
hostname = "0.4"
